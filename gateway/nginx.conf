# API gateway — единая точка входа в магазин.
# Клиент знает только один адрес (http://localhost:8080),
# а nginx по началу пути решает, в какой сервис передать запрос.

server {
    listen 80;
    charset utf-8;

    # /products...  -> catalog-service
    location /products {
        proxy_pass http://catalog-service:8000;
    }

    # /cart...      -> cart-service
    location /cart {
        proxy_pass http://cart-service:8000;
    }

    # /orders...    -> order-service
    location /orders {
        proxy_pass http://order-service:8000;
    }

    location = / {
        default_type text/plain;
        return 200 "Grocery shop API gateway. Routes: /products, /cart/{user_id}, /orders\n";
    }
}
