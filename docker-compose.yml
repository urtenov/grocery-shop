# Рецепт запуска всего магазина одной командой:  docker compose up --build
# Каждый блок в "services" — это отдельный контейнер.

services:

  # ---------- Инфраструктура (готовые образы с Docker Hub) ----------

  postgres:                         # База данных
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql/data   # данные сохраняются между перезапусками
    healthcheck:                    # Docker регулярно проверяет, что БД готова принимать запросы
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:                            # Кэш и хранилище корзин
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:                         # Брокер сообщений
    image: rabbitmq:3-management    # "management" = с веб-панелью
    ports:
      - "15672:15672"               # веб-панель: http://localhost:15672 (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ---------- Наши микросервисы (собираются из папок проекта) ----------

  catalog-service:
    build: ./catalog-service
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"                 # Swagger: http://localhost:8001/docs
    depends_on:                     # не стартовать, пока БД и Redis не готовы
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cart-service:
    build: ./cart-service
    environment:
      REDIS_URL: redis://redis:6379/0
      CATALOG_URL: http://catalog-service:8000
    ports:
      - "8002:8000"                 # Swagger: http://localhost:8002/docs
    depends_on:
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_started

  order-service:
    build: ./order-service
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      CATALOG_URL: http://catalog-service:8000
      CART_URL: http://cart-service:8000
    ports:
      - "8003:8000"                 # Swagger: http://localhost:8003/docs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_started
      cart-service:
        condition: service_started

  notification-service:
    build: ./notification-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway:                          # API gateway — единая точка входа
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"                   # http://localhost:8080
    depends_on:
      - catalog-service
      - cart-service
      - order-service

volumes:
  pgdata:
